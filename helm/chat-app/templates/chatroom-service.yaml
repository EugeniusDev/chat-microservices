apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatroom-service
spec:
  replicas: {{ .Values.chatroomService.replicas }}
  selector:
    matchLabels:
      app: chatroom-service
  template:
    metadata:
      labels:
        app: chatroom-service
    spec:
      containers:
        - name: chatroom-service
          image: {{ .Values.chatroomService.image }}
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.chatroomService.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.dbName }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.database.username }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.database.password }}
            - name: USER_SERVICE_URL
              value: "http://user-service:{{ .Values.userService.port }}/api/v1/users"
          readinessProbe:
            tcpSocket:
              port: {{ .Values.chatroomService.port }}
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.chatroomService.port }}
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: chatroom-service
spec:
  selector:
    app: chatroom-service
  ports:
    - protocol: TCP
      port: {{ .Values.chatroomService.port }}
      targetPort: {{ .Values.chatroomService.port }}