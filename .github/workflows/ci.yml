name: Java CI with SonarCloud

on:
  pull_request:
    branches: [ "labwork4" ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test all services
        # Виконуємо компіляцію, packaging та запуск тестів для кожного сервісу
        run: |
          for service in user-service chatroom-service message-service; do
            echo "Processing $service..."
            cd $service
            mvn clean verify # Збірка та запуск тестів [cite: 24, 25]
            cd ..
          done

      - name: SonarCloud Scan
        # Крок статичного аналізу коду
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=chat-microservices \
            -Dsonar.organization=eugeniusdev \
            -Dsonar.host.url=https://sonarcloud.io