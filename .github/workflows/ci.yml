name: Java CI with SonarCloud

on:
  pull_request:
    branches: [ "labwork4" ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build all services
        run: |
          for service in user-service chatroom-service message-service; do
            echo "Building $service..."
            cd $service
            mvn clean package -DskipTests
            cd ..
          done

      - name: Run unit and integration tests
        run: |
          for service in user-service chatroom-service message-service; do
            echo "Testing $service..."
            cd $service
            mvn verify
            cd ..
          done

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=EugeniusDev_chat-microservices
            -Dsonar.organization=eugeniusdev
            -Dsonar.java.binaries=user-service/target/classes,chatroom-service/target/classes,message-service/target/classes