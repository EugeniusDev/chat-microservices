server.port=8082
spring.application.name=chatroom-service

spring.datasource.url=jdbc:h2:mem:chat_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console-chatroom

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#user.service.url=http://localhost:8081/api/v1/users
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

logging.level.com.yourcompany.chatroomservice=DEBUG