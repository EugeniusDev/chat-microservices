server.port=8083
spring.application.name=message-service

spring.datasource.url=jdbc:postgresql://postgres-db:5432/microservices_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=myuser
spring.datasource.password=mypassword

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

user.service.url=http://user-service:8081/api/v1/users
chatroom.service.url=http://chatroom-service:8082/api/v1/chatrooms

logging.level.com.yourcompany.messageservice=DEBUG