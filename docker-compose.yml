version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: microservices_db
    ports:
      - "5433:5432"
    restart: always

  # Сервіс користувачів
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres-db
    restart: on-failure

  # Сервіс чат-кімнат
  chatroom-service:
    build:
      context: ./chatroom-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - postgres-db
      - user-service
    restart: on-failure

  # Сервіс повідомлень
  message-service:
    build:
      context: ./message-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - postgres-db
      - user-service
      - chatroom-service
    restart: on-failure