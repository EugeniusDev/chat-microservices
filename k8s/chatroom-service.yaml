apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatroom-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatroom-service
  template:
    metadata:
      labels:
        app: chatroom-service
    spec:
      containers:
        - name: chatroom-service
          image: chatroom-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-db:5432/microservices_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "myuser"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "mypassword"
            - name: USER_SERVICE_URL
              value: "http://user-service:8081/api/v1/users"
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: chatroom-service
spec:
  selector:
    app: chatroom-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082